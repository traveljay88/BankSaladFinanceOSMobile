name: Build Current Android APK

on:
  push:
    branches:
      - main
    paths:
      - '.github/BUILD_CURRENT_APK'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Install Android SDK platform
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Verify source package
        run: python3 tests/verify_package.py
      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: BankSaladFinanceOSMobile-current-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
