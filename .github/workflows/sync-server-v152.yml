name: Sync Server Brain v1.5.2

on:
  push:
    paths:
      - 'backend/_server_sync/READY'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild canonical backend Code.gs
        shell: bash
        run: |
          set -euo pipefail
          cat backend/_server_sync/part-*.txt > backend/Code.gs
          grep -q "const BACKEND_VERSION = '1.5.2';" backend/Code.gs
          grep -q "const POLICY_VERSION = '3.5.2';" backend/Code.gs
          test "$(wc -l < backend/Code.gs)" -ge 4800
      - name: Commit canonical source and clean temporary sync files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf backend/_server_sync
          git rm .github/workflows/sync-server-v152.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/Code.gs
          git commit -m "Promote Server Brain v1.5.2 to canonical backend Code.gs"
          git push
